<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CallZUP — Notificações</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:25px;background:#f3f5f8;color:#172033;font:15px system-ui,sans-serif}.app{max-width:850px;margin:auto;background:white;border:1px solid #e2e7ef;border-radius:18px;overflow:hidden}.head{padding:24px;border-bottom:1px solid #e8ecf2;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0 0 7px;font-size:26px}p{color:#667085;line-height:1.5;margin:0}.tabs{display:flex;gap:8px;padding:18px 24px 0;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer}.tab{background:#f0f3f8;color:#45536a}.active{background:#e5edff;color:#245bd4}.content,.prefs{padding:10px 24px 28px}.group{margin-top:24px;color:#7b8493;font-size:12px;font-weight:750}.item{display:flex;gap:13px;padding:17px 3px;border-bottom:1px solid #edf0f4;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:#2864dc;margin-top:7px;flex:none}.read{background:#c5ccd7}.details{flex:1}.details strong{display:block;margin-bottom:5px}.details p{font-size:14px}.meta{font-size:12px;color:#8a93a2;margin-top:7px}.open{background:#eef3ff;color:#245bd4}.prefs{display:none}.pref{display:flex;justify-content:space-between;padding:17px 0;border-bottom:1px solid #edf0f4;gap:15px}.pref p{font-size:13px}.switch{width:46px;height:26px;border-radius:20px;background:#c8ced8;position:relative}.switch.on{background:#2864dc}.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:white;border-radius:50%}.switch.on:after{left:23px}.empty{text-align:center;padding:55px 10px;color:#667085}.foot{padding:15px 24px;border-top:1px solid #e8ecf2;color:#8992a0;font-size:12px}@media(max-width:540px){body{padding:8px}.head{padding:18px;align-items:flex-start;flex-direction:column}.tabs,.content,.prefs{padding-left:18px;padding-right:18px}}
</style></head><body><div class="app">
<header class="head"><div><b style="color:#245bd4">CallZUP</b><h1 id="heading">Notificações</h1><p id="sub">Acompanhe atualizações importantes da sua operação.</p></div><button id="prefsBtn" class="tab">⚙ Preferências</button></header>
<section id="center"><div class="tabs"><button class="tab active" data-filter="all">Todas</button><button class="tab" data-filter="unread">Não lidas</button><button class="tab" id="markAll">Marcar todas como lidas</button></div><div class="content" id="list"></div></section>
<section class="prefs" id="prefs"><h2>Preferências de notificações</h2><p>Escolha quais atividades devem gerar alertas para você.</p><div id="switches"></div><button class="tab" id="back">Voltar à central</button> <button class="tab active" id="save">Salvar preferências</button></section>
<footer class="foot">Protótipo demonstrativo · Dados fictícios · Sem conexão com serviços reais</footer></div>
<script>
const notes=[{day:"HOJE",title:"Nova mensagem",desc:"Ana enviou uma mensagem em Operação Salvador.",origin:"Operação Salvador",time:"10:42",read:false},{day:"HOJE",title:"Você foi mencionado",desc:"Carlos mencionou você em Expedição.",origin:"Expedição",time:"09:18",read:false},{day:"ONTEM",title:"Ocorrência atualizada",desc:"A ocorrência OC-204 recebeu uma atualização.",origin:"OC-204",time:"16:30",read:true},{day:"ANTERIORES",title:"Solicitação atribuída",desc:"Uma solicitação foi atribuída a você.",origin:"SOL-18",time:"22/11",read:true}];let filter="all";
function render(){let shown=notes.filter(n=>filter==="all"||!n.read);let out="";["HOJE","ONTEM","ANTERIORES"].forEach(day=>{let arr=shown.filter(n=>n.day===day);if(arr.length){out+="<div class=group>"+day+"</div>";arr.forEach(n=>{let idx=notes.indexOf(n);out+="<div class=item><span class=dot "+(n.read?"read":"") +"></span><div class=details><strong>"+n.title+"</strong><p>"+n.desc+"</p><div class=meta>"+n.origin+" · "+n.time+" · "+(n.read?"Lida":"Não lida")+"</div></div><button class=open onclick=readNote("+idx+")>Abrir</button></div>"})}});document.getElementById("list").innerHTML=out||"<div class=empty><b>Nenhuma notificação encontrada</b><p>Você não tem notificações neste filtro.</p></div>";document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter))}
function readNote(i){notes[i].read=true;alert("Destino demonstrativo: "+notes[i].origin+". Em produção, verificar permissão antes de abrir.");render()}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.getElementById("markAll").onclick=()=>{if(confirm("Marcar todas as notificações como lidas?")){notes.forEach(n=>n.read=true);render()}};
document.getElementById("prefsBtn").onclick=()=>{document.getElementById("center").style.display="none";document.getElementById("prefs").style.display="block";document.getElementById("heading").textContent="Preferências";document.getElementById("sub").textContent="Gerencie as categorias de alertas."};
document.getElementById("back").onclick=()=>{document.getElementById("center").style.display="block";document.getElementById("prefs").style.display="none";document.getElementById("heading").textContent="Notificações";document.getElementById("sub").textContent="Acompanhe atualizações importantes da sua operação."};
const settings=[["Mensagens","Novas mensagens nas conversas",true],["Menções","Quando alguém mencionar você",true],["Ocorrências","Atualizações que você acompanha",true],["Solicitações","Atualizações relacionadas a você",true],["E-mail","Canal externo demonstrativo",false],["Navegador","Notificações web push demonstrativas",false]];
document.getElementById("switches").innerHTML=settings.map((s,i)=>"<div class=pref><div><b>"+s[0]+"</b><p>"+s[1]+"</p></div><button class=switch "+(s[2]?"on":"")+" onclick=toggle("+i+",this) aria-label=Alternar></button></div>").join("");
function toggle(i,el){settings[i][2]=!settings[i][2];el.classList.toggle("on",settings[i][2])}document.getElementById("save").onclick=()=>alert("Preferências demonstrativas salvas nesta sessão.");render();
</script></body></html>
